model_list:
  - model_name: "bedrock/*"
    litellm_params:
      model: "bedrock/*"
      custom_llm_provider: bedrock  
general_settings:
  master_key: "sk-litellm-master-key"
  store_model_in_db: true
  store_prompts_in_spend_logs: true
litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 600
